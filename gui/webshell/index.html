<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c1c1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/pwa/manifest.json">
  <link rel="icon" type="image/jpeg" href="/assets/favicon.jpg">
  <link rel="apple-touch-icon" href="/assets/cobra-logo.jpg">
  <title>Cobra Commander</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100dvh; overflow: hidden; overscroll-behavior: none; }
    body {
      background: #1c1c1e;
      color: #e8e5e0;
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      -webkit-overflow-scrolling: touch;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #app { height: 100%; }
    #loading {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100dvh; color: #00ff41; font-size: 14px; gap: 16px;
    }
    #loading img { width: 80px; height: 80px; border-radius: 50%; filter: drop-shadow(0 0 20px rgba(0,255,65,0.4)); }
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    #loading span { animation: pulse 1.5s ease-in-out infinite; }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <img src="/assets/cobra-logo.jpg" alt="Cobra Commander">
      <span>Connecting to Cobra Commander...</span>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
